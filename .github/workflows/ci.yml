name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: install redis-cli
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: test
        run: ./gradlew test --no-daemon
